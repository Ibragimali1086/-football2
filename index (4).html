/* ONLINE MODE: serverdən məlumat oxuyur, yalnız admin yaza bilir */
window.REMOTE=(function(){
var R={mode:'local',admin:false,txt:null,last:null,pending:null,timer:null,status:'',pw:null,on:false};
try{R.pw=localStorage.getItem('ftm_admin_pw')}catch(e){}
try{
var x=new XMLHttpRequest();x.open('GET','/api/state?_='+Date.now(),false);
if(R.pw)x.setRequestHeader('x-admin-password',R.pw);
x.send();
if(x.status===200){
var j=JSON.parse(x.responseText);R.mode='online';R.txt=j.state;R.last=j.state;R.admin=!!j.admin;
if(R.pw&&!j.admin){try{localStorage.removeItem('ftm_admin_pw');sessionStorage.setItem('ftm_badpw','1')}catch(e){}R.pw=null}
try{if(j.state)localStorage.setItem('ftm_cache',j.state)}catch(e){}
}else if(x.status===404||location.protocol==='file:'){R.mode='local'}
else{R.mode='error'}
}catch(e){R.mode=location.protocol==='file:'?'local':'error'}
R.on=R.mode!=='local';
R.text=function(){if(R.mode==='online')return R.txt;try{return localStorage.getItem('ftm_cache')}catch(e){return null}};
R.set=function(s){R.status=s;if(R.ui)R.ui()};
R.push=function(v){
if(!R.admin||R.mode!=='online')return;
var o;try{o=JSON.parse(v)}catch(e){return}
o.dr={};o.md=null;o.view='';
var s=JSON.stringify(o);
if(s===R.last)return;
R.pending=s;R.set('saving');clearTimeout(R.timer);R.timer=setTimeout(function(){R.flush()},700)};
R.flush=function(o){
if(R.busy){R.again=true;return}
var s=R.pending;if(s==null)return;
var opt={method:'POST',headers:{'Content-Type':'application/json','x-admin-password':R.pw||''},body:JSON.stringify({state:s})};
if(o&&o.unload&&s.length<60000)opt.keepalive=true;
R.busy=true;
fetch('/api/state',opt).then(function(r){
R.busy=false;
if(r.ok){R.last=s;if(R.pending===s)R.pending=null;R.retry=0;R.err='';
if(R.pending!=null){R.flush()}else{R.set('ok')}return}
if(r.status===401){R.set('auth');return}
return r.text().then(function(t){var m='';try{m=JSON.parse(t).error||''}catch(e){m=String(t).slice(0,40)}
R.err=r.status+(m?' '+m:'');console.error('save failed',r.status,String(t).slice(0,200));R.fail()})
}).catch(function(e){R.busy=false;R.err='şəbəkə xətası';console.error(e);R.fail()})};
R.fail=function(){R.set('err');R.retry=(R.retry||0)+1;if(R.retry<=3)setTimeout(function(){R.flush()},4000)};
addEventListener('pagehide',function(){R.flush({unload:true})});
return R})();
</script>

p.style.cssText='position:fixed;top:10px;right:10px;z-index:99999;font:600 12px system-ui,sans-serif;padding:7px 12px;border-radius:999px;background:#111827;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer;opacity:.93;user-select:none';
function ui(){
if(R.mode==='error'){p.textContent='⚠️ Serverə qoşulmaq olmadı · yenilə';return}
if(RO){p.textContent='👁 Yalnız baxış · 🔐 Admin';return}
var t={saving:' · saxlanır…',ok:' · saxlandı ✓',err:' · ⚠️ saxlanmadı'+(R.err?' ('+R.err+')':''),auth:' · ⚠️ parol səhvdir'}[R.status]||'';
p.textContent='✏️ Admin'+t}
R.ui=ui;ui();
p.onclick=function(){
if(R.mode==='error'){location.reload();return}
if(RO){var pw=prompt('Admin parolu:');if(!pw)return;try{localStorage.setItem('ftm_admin_pw',pw)}catch(e){alert('Brauzer yaddaşı əlçatan deyil');return}location.reload()}
else if(confirm('Admin rejimindən çıxılsın?')){try{localStorage.removeItem('ftm_admin_pw')}catch(e){}location.reload()}};
document.body.appendChild(p);
try{if(sessionStorage.getItem('ftm_badpw')){sessionStorage.removeItem('ftm_badpw');setTimeout(function(){alert('Admin parolu səhvdir.')},50)}}catch(e){}
if(!RO)return;

/* ---- yalnız baxış: bütün dəyişikliklər bağlıdır ---- */
var WA=['go','closeM','edit','phase','tprint','tcopy','cmpShare','pickN','pickS','pickF','pickBack'],WC=['filt','sort','cmp','attP','rgsel'];
function stop(e){e.stopImmediatePropagation();e.preventDefault()}
addEventListener('click',function(e){var t=e.target;if(!t||!t.closest)return;
var a=t.closest('[data-act]');
if(a){if(WA.indexOf(a.dataset.act)<0)stop(e);return}
if(t.closest('#dboard'))stop(e)},true);
addEventListener('pointerdown',function(e){var t=e.target;if(t&&t.closest&&t.closest('.tok,.dit'))stop(e)},true);
addEventListener('dblclick',stop,true);
['input','change'].forEach(function(n){addEventListener(n,function(e){var t=e.target;
if(t&&t.dataset&&t.dataset.ch&&WC.indexOf(t.dataset.ch)>=0)return;stop(e)},true)});
function lock(){document.querySelectorAll('#main input,#main textarea,#main select,#main button,#modal input,#modal textarea,#modal select,#modal button').forEach(function(el){
var ch=el.dataset.ch,ac=el.dataset.act;
if(ch&&WC.indexOf(ch)>=0)return;if(ac&&WA.indexOf(ac)>=0)return;
if(el.tagName==='BUTTON')el.style.display='none';else el.disabled=true})}
var q=false;new MutationObserver(function(){if(q)return;q=true;Promise.resolve().then(function(){q=false;lock()})}).observe(document.body,{childList:true,subtree:true});
lock();

/* ---- 30 saniyədən bir yenilənmə yoxlanışı ---- */
setInterval(function(){if(document.hidden||draft)return;
fetch('/api/state',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
if(!j||j.state==null||j.state===R.txt)return;
R.txt=j.state;S=Object.assign({},D,JSON.parse(j.state));ensure();fixF();render()}).catch(function(){})},30000);
})();
