<style>
:root{--g:#7c3aed;--g2:#db2777;--gr:linear-gradient(135deg,var(--g),var(--g2));--bg:#f3f0ff;--p:#fff;--p2:#f2f0f9;--b:#e7e3f3;--t:#1b1530;--m:#7b7794;--r:#e11d48;--y:#d97706;--sh:0 10px 30px rgba(80,50,160,.12)}
:root[data-dk="1"]{--bg:#120f20;--p:#1c1830;--p2:#262140;--b:#332d52;--t:#f1eefc;--m:#9d98b8;--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}
body{background:linear-gradient(135deg,var(--bg),color-mix(in srgb,var(--g) 28%,var(--bg)));background-attachment:fixed;color:var(--t);font:14px/1.45 "Plus Jakarta Sans",system-ui,Segoe UI,Roboto,sans-serif;display:flex;min-height:100vh}
aside{width:250px;background:var(--p);border-radius:26px;padding:20px 14px;position:sticky;top:18px;height:calc(100vh - 36px);margin:18px 0 18px 18px;flex-shrink:0;box-shadow:var(--sh);overflow:auto;display:flex;flex-direction:column}
.logo{font-weight:800;font-size:19px;margin:0 8px 20px}.logo b{background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
#nav{flex:1}#nav a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:14px;color:var(--m);text-decoration:none;margin-bottom:3px;transition:.2s;font-weight:500}
#nav a:hover{background:var(--p2);color:var(--t)}#nav a.on{background:var(--gr);color:#fff;font-weight:700;box-shadow:0 8px 20px color-mix(in srgb,var(--g) 40%,transparent)}
.ver{color:var(--m);font-size:12px;margin:10px 8px 0}
main{flex:1;padding:28px 30px;min-width:0;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:30px;margin-bottom:6px;letter-spacing:-.5px}h3{margin-bottom:10px;font-size:16px}
.mut{color:var(--m)}.sm{font-size:12px;margin-top:6px}
.card{background:var(--p);border-radius:22px;padding:20px;margin-top:16px;display:block;color:inherit;text-decoration:none;box-shadow:var(--sh)}
a.hc{transition:.2s}a.hc:hover{transform:translateY(-3px)}
.hc .ic{font-size:30px}.hc p{color:var(--m);margin:4px 0 10px}.hc .st{color:var(--g);font-size:12px;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>.card{margin-top:0}
.btn{background:var(--p2);color:var(--t);border:1px solid var(--b);padding:10px 16px;border-radius:13px;cursor:pointer;font:inherit;font-weight:500;transition:.2s;margin:3px 3px 3px 0}

.ppb{width:min(640px,100%);max-height:90vh;overflow:auto;background:linear-gradient(160deg,rgba(16,40,38,.94),rgba(9,20,32,.96));border:1px solid rgba(52,211,153,.35);border-radius:24px;padding:20px;color:#e6f4ee;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 40px rgba(16,185,129,.15)}
.ppt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.ppt .chip{background:rgba(255,255,255,.07);color:#cfe8dd;border:1px solid rgba(255,255,255,.12)}.ppt .chip.on{background:#10b981;color:#04201a}
.ppo{display:flex;gap:16px;align-items:center;margin-bottom:14px}.ppo img,.ppn{width:130px;height:150px;border-radius:18px;object-fit:cover;flex:none}.ppn{display:grid;place-items:center;font:800 56px var(--hf);background:rgba(255,255,255,.07)}.ppo h2{color:#fff;margin:0}
.ppg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.ppk{background:rgba(255,255,255,.06);border-radius:14px;padding:12px;text-align:center}.ppk .big{font-size:28px;color:#34d399;-webkit-text-fill-color:#34d399;background:none}
#pp .mrow{border-color:rgba(255,255,255,.1)}#pp .mrow:hover{background:rgba(255,255,255,.06)}#pp .pb{background:rgba(255,255,255,.1)}#pp .pb i{background:#34d399}#pp a{color:#34d399}
@media(max-width:560px){.ppo{flex-direction:column;text-align:center}}

/* V18 tactics */
.txw{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;margin-top:14px}.txw.one{grid-template-columns:1fr}
.txp{background:rgba(8,20,31,.85);border:1px solid rgba(52,211,153,.3);border-radius:22px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 40px rgba(16,185,129,.08)}
#txs{display:block;width:100%;max-height:78vh;touch-action:none;user-select:none}
body[data-v="tac"] .txr .card{padding:14px;margin-bottom:12px}
.txg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.txg .btn{padding:8px 4px;font-size:12px}
.txs{max-height:260px;overflow:auto}.txi{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;cursor:grab;border:1px solid transparent}.txi:hover{background:rgba(255,255,255,.07)}.txi.on{border-color:#34d399;opacity:.6}
.txi b{width:26px;color:#34d399}.txd{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid #fff;vertical-align:middle}
@media(max-width:1000px){.txw{grid-template-columns:1fr}#txs{max-height:70vh}.txg{grid-template-columns:repeat(4,1fr)}}

details.card summary{cursor:pointer;list-style:none}details.card summary::-webkit-details-marker{display:none}details.card[open] summary{margin-bottom:6px}
body[data-v="tac"] details.card label{display:block;margin-top:6px}body[data-v="tac"] details.card .btn{margin-top:8px}
body[data-v="tac"] .btn[disabled]{opacity:.35;pointer-events:none}

/* ONLINE MODE: serverdən məlumat oxuyur, yalnız admin yaza bilir */
window.REMOTE=(function(){
var R={mode:'local',admin:false,txt:null,last:null,pending:null,timer:null,status:'',pw:null,on:false};
try{R.pw=localStorage.getItem('ftm_admin_pw')}catch(e){}
try{
var x=new XMLHttpRequest();x.open('GET','/api/state?_='+Date.now(),false);
if(R.pw)x.setRequestHeader('x-admin-password',R.pw);
x.send();
if(x.status===200){
var j=JSON.parse(x.responseText);R.mode='online';R.txt=j.state;R.last=j.state;R.admin=!!j.admin;
if(R.pw&&!j.admin){try{localStorage.removeItem('ftm_admin_pw');sessionStorage.setItem('ftm_badpw','1')}catch(e){}R.pw=null}
try{if(j.state)localStorage.setItem('ftm_cache',j.state)}catch(e){}
}else if(x.status===404||location.protocol==='file:'){R.mode='local'}
else{R.mode='error'}
}catch(e){R.mode=location.protocol==='file:'?'local':'error'}
R.on=R.mode!=='local';
R.text=function(){if(R.mode==='online')return R.txt;try{return localStorage.getItem('ftm_cache')}catch(e){return null}};
R.set=function(s){R.status=s;if(R.ui)R.ui()};
R.push=function(v){
if(!R.admin||R.mode!=='online')return;
var o;try{o=JSON.parse(v)}catch(e){return}
o.dr={};o.md=null;o.view='';
var s=JSON.stringify(o);
if(s===R.last)return;
R.pending=s;R.set('saving');clearTimeout(R.timer);R.timer=setTimeout(function(){R.flush()},700)};
R.flush=function(o){
if(R.busy){R.again=true;return}
var s=R.pending;if(s==null)return;
var opt={method:'POST',headers:{'Content-Type':'application/json','x-admin-password':R.pw||''},body:JSON.stringify({state:s})};
if(o&&o.unload&&s.length<60000)opt.keepalive=true;
R.busy=true;
fetch('/api/state',opt).then(function(r){
R.busy=false;
if(r.ok){R.last=s;if(R.pending===s)R.pending=null;R.retry=0;R.err='';
if(R.pending!=null){R.flush()}else{R.set('ok')}return}
if(r.status===401){R.set('auth');return}
return r.text().then(function(t){var m='';try{m=JSON.parse(t).error||''}catch(e){m=String(t).slice(0,40)}
R.err=r.status+(m?' '+m:'');console.error('save failed',r.status,String(t).slice(0,200));R.fail()})
}).catch(function(e){R.busy=false;R.err='şəbəkə xətası';console.error(e);R.fail()})};
R.fail=function(){R.set('err');R.retry=(R.retry||0)+1;if(R.retry<=3)setTimeout(function(){R.flush()},4000)};
addEventListener('pagehide',function(){R.flush({unload:true})});
return R})();
</script>
